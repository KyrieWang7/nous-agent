services:
  # ==========================================================================
  # Agent API (LangGraph Server) — port 7776
  # ==========================================================================
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: nous-agent-server
    restart: unless-stopped
    ports:
      - "7776:7776"
    volumes:
      # Mount source code for hot-reload
      - ./agent/src:/app/src
      - ./agent/config.yaml:/app/config.yaml
      - ./agent/extensions_config.json:/app/extensions_config.json
      - ./agent/skills:/app/skills
    env_file:
      - .env
    environment:
      - LANGGRAPH_PG_URI=postgresql://nous-ai:Nous%402026%21@host.docker.internal:5432/nous_ai_db
      - REDIS_URL=redis://:Nous%402026%21@host.docker.internal:6379/0
    command: ["uv", "run", "uvicorn", "src.server:app", "--host", "0.0.0.0", "--port", "7776", "--reload", "--reload-dir", "src"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==========================================================================
  # Gateway API — port 7777
  # ==========================================================================
  gateway:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: nous-agent-gateway
    restart: unless-stopped
    ports:
      - "7777:7777"
    volumes:
      # Mount source code for hot-reload
      - ./agent/src:/app/src
      - ./agent/config.yaml:/app/config.yaml
      - ./agent/extensions_config.json:/app/extensions_config.json
      - ./agent/skills:/app/skills
    env_file:
      - .env
    environment:
      - LANGGRAPH_PG_URI=postgresql://nous-ai:Nous%402026%21@host.docker.internal:5432/nous_ai_db
      - REDIS_URL=redis://:Nous%402026%21@host.docker.internal:6379/0
    command: ["uv", "run", "uvicorn", "src.gateway.app:app", "--host", "0.0.0.0", "--port", "7777", "--reload", "--reload-dir", "src"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

