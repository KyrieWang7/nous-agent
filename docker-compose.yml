name: nous-agent

services:
  # Local Remote Sandbox API v2 control plane. It is intentionally available
  # only on the Compose network; production points agent-go at an independently
  # deployed sandbox host implementing the same contract.
  sandboxd:
    build:
      context: ./agent-go
      dockerfile: Dockerfile.dev
    container_name: nous-agent-sandboxd
    restart: unless-stopped
    command: ["air", "-c", ".air.sandboxd.toml"]
    environment:
      SANDBOXD_ADDRESS: ":7780"
      SANDBOX_CONTROLLER_TOKEN: "${SANDBOX_CONTROLLER_TOKEN:?SANDBOX_CONTROLLER_TOKEN must be set}"
      SANDBOX_BASE_DIR: /var/lib/nous-sandbox
      SANDBOX_HOST_BASE_DIR: "${SANDBOX_HOST_BASE_DIR:-/tmp/nous-agent-sandboxes}"
      SANDBOX_IMAGE: "${SANDBOX_IMAGE:-alpine:3.20}"
    volumes:
      - ./agent-go:/app
      - "${DOCKER_HOST_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
      - "${SANDBOX_HOST_BASE_DIR:-/tmp/nous-agent-sandboxes}:/var/lib/nous-sandbox"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7780/ok"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 6

  # Primary Agent Harness. Dockerfile.dev runs Air, so Go and YAML changes reload.
  agent-go:
    build:
      context: ./agent-go
      dockerfile: Dockerfile.dev
    container_name: nous-agent-go-server
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-7776}:7776"
    volumes:
      - ./agent-go:/app
      - ./skills/public:/opt/nous/skills/public:ro
      - gateway_custom_skills:/opt/nous/skills/custom:ro
      - gateway_config:/app/extensions
      - agent_go_data:/app/.nous-agent
    environment:
      NOUS_AGENT_ADDR: ":7776"
      DATABASE_URL: "${DATABASE_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
      NOUS_EXTENSIONS_CONFIG_PATH: /app/extensions/extensions.json
      NOUS_SKILLS_PATH: /opt/nous/skills
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      TUYOO_BASE_URL: "${TUYOO_BASE_URL:-}"
      TUYOO_API_KEY: "${TUYOO_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      JINA_API_KEY: "${JINA_API_KEY:-}"
      SANDBOX_CONTROLLER_TOKEN: "${SANDBOX_CONTROLLER_TOKEN:?SANDBOX_CONTROLLER_TOKEN must be set}"
    depends_on:
      sandboxd:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Primary control plane and file conversion service.
  gateway-go:
    build:
      context: ./gateway-go
      dockerfile: Dockerfile
    container_name: nous-agent-go-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-7777}:7777"
    environment:
      GATEWAY_ADDR: ":7777"
      DATABASE_URL: "${DATABASE_URL:-}"
      NOUS_HARNESS_CONFIG_PATH: /etc/nous-agent/config.yaml
      NOUS_EXTENSIONS_CONFIG_PATH: /config/extensions.json
      NOUS_SKILLS_ROOT: /opt/nous/skills
      NOUS_WORKSPACE_ROOT: /data/workspaces
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:7775,http://127.0.0.1:7775}"
    volumes:
      - ./agent-go/config.example.yaml:/etc/nous-agent/config.yaml:ro
      - ./skills/public:/opt/nous/skills/public:ro
      - gateway_custom_skills:/opt/nous/skills/custom
      - gateway_config:/config
      - agent_go_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  agent_go_data:
  gateway_config:
  gateway_custom_skills:
