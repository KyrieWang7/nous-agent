server:
  address: ":7776"

default_model: deepseek-v4-flash
# Setting both TUYOO_BASE_URL and TUYOO_API_KEY routes every
# openai-compatible model below through that gateway without editing this file.
models:
  - name: deepseek-v4-flash
    display_name: DeepSeek V4 Flash
    description: Fast DeepSeek model using the same endpoint as the Python Harness
    provider: openai-compatible
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com
    api_key: $DEEPSEEK_API_KEY
    max_tokens: 8192
    temperature: 0.7
    context_length: 128000
    timeout: 120
    supports_thinking: true
    # Optional integer micro-currency rates per one million tokens.
    # pricing:
    #   input_per_million_micros: 0
    #   output_per_million_micros: 0
    #   cached_input_per_million_micros: 0
    when_thinking_enabled:
      extra_body:
        thinking:
          type: enabled

  - name: MiniMax-M2.7-highspeed
    display_name: MiniMax M2.7 Highspeed
    provider: openai-compatible
    model: MiniMax-M2.7-highspeed
    base_url: https://api.minimax.chat/v1
    api_key: $MINIMAX_API_KEY
    max_tokens: 8192
    temperature: 0.7
    context_length: 128000
    timeout: 120
    supports_thinking: true

  - name: gpt-4o
    display_name: GPT-4o
    provider: openai-compatible
    model: gpt-4o
    api_key: $OPENAI_API_KEY
    max_tokens: 4096
    temperature: 0.7
    context_length: 128000
    timeout: 120
    supports_vision: true

  - name: deepseek-v4-pro
    display_name: DeepSeek V4 Pro
    provider: openai-compatible
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key: $DEEPSEEK_API_KEY
    max_tokens: 8192
    temperature: 0.7
    context_length: 128000
    timeout: 120
    supports_thinking: true
    when_thinking_enabled:
      extra_body:
        thinking:
          type: enabled

sandbox:
  enabled: true
  provider: local
  base_dir: ./.nous-agent/workspaces
  exec_timeout: 30s
  # Use a remote or Kubernetes-backed sandbox service instead:
  # provider: remote
  # remote_url: https://sandbox.internal
  # remote_headers:
  #   Authorization: Bearer $SANDBOX_TOKEN

permissions:
  mode: workspace_write

# Python-compatible community tool declarations. Search and image search use
# Tavily; web_fetch uses Jina Reader. Empty keys fall back to the matching
# TAVILY_API_KEY / JINA_API_KEY environment variables.
tool_groups:
  - name: web

tools:
  - name: web_search
    group: web
    use: src.community.tavily.tools:web_search_tool
    api_key: $TAVILY_API_KEY
    max_results: 5
    timeout: 30s
  - name: web_fetch
    group: web
    use: src.community.jina_ai.tools:web_fetch_tool
    api_key: $JINA_API_KEY
    timeout: 10s
  - name: image_search
    group: web
    use: src.community.image_search.tools:image_search_tool
    api_key: $TAVILY_API_KEY
    max_results: 5
    timeout: 30s

plugins:
  enabled: true
  directories:
    - ~/.deerflow/plugins
    - .deerflow/plugins
  # plugin.json requiredPermission is a minimum run permission. It never
  # elevates a run; omitted values default to danger_full_access.

# Optional ACP v1 subprocess agents. The Go Harness performs the native
# initialize/session/new/session/prompt JSON-RPC flow.
# acp_agents:
#   codex:
#     command: npx
#     args: ["-y", "@zed-industries/codex-acp"]
#     description: External coding agent
#     auto_approve_permissions: false

skills:
  enabled: true
  path: ../agent/skills/public

subagents:
  enabled: true
  max_concurrent: 3
  max_turns: 50
  task_ttl: 24h
  timeout: 15m
  # Optional per-profile deadlines; omitted profiles inherit timeout.
  # agents:
  #   explore:
  #     timeout: 5m
  #   verification:
  #     timeout: 10m

extensions:
  mcp_servers: {}
  # filesystem:
  #   enabled: true
  #   type: stdio
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/mnt/user-data"]

memory:
  enabled: false
  max_facts: 50
  confidence_threshold: 0.7
  injection_tokens: 1000

title:
  enabled: true
  max_words: 8
  max_chars: 80

swarm:
  enabled: false
  max_team_size: 5
  message_poll_interval: 2s
  teammate_timeout: 15m
  poll_limit: 50

summarization:
  enabled: true
  trigger_tokens: 96000
  keep_messages: 10
  max_summary_tokens: 1024
  max_input_messages: 200
  max_input_chars: 120000

guardrails:
  enabled: false
  fail_closed: true
  input: true
  output: true

hooks: []
# - name: protect-production
#   enabled: true
#   events: [pre_tool_use]
#   command: ./hooks/protect-production
#   matcher: "^(bash|write_file)$"
#   timeout: 10s

loop:
  max_iterations: 100
  stop_reinjection_limit: 3
  deadline: 30m
  tool_concurrency: 4
  token_budget: 100000
  # Optional hard cost ceiling in integer micro-units for the whole run.
  cost_budget_micros: 0
  middleware_timeout: 30s

runtime:
  event_buffer_size: 500
  event_ttl: 24h
  heartbeat_interval: 15s
  redis_url: $REDIS_URL
  database_url: $DATABASE_URL
