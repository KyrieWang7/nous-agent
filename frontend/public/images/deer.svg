    " />
    <!-- N - diagonal -->
    <path d="
      M 300 240
      L 340 240
      L 660 560
      L 620 560
      Z
    " />
    <!-- N - right vertical -->
    <path d="
      M 620 240
      L 660 240
      L 660 560
      L 620 560
      Z
    " />

    <!-- Neural network nodes -->
    <!-- Top-left node -->
    <circle cx="250" cy="260" r="32" />
    <!-- Center-top node -->
    <circle cx="500" cy="140" r="28" />
    <!-- Top-right node -->
    <circle cx="740" cy="220" r="32" />
    <!-- Center node -->
    <circle cx="500" cy="440" r="36" />
    <!-- Bottom-left node -->
    <circle cx="280" cy="580" r="28" />
    <!-- Right-mid node -->
    <circle cx="720" cy="480" r="32" />

    <!-- Neural connection lines -->
    <!-- Top-left to center-top -->
    <path d="M 275 243 L 480 152 L 486 168 L 280 258 Z" />
    <!-- Center-top to top-right -->
    <path d="M 520 148 L 718 207 L 714 225 L 516 164 Z" />
    <!-- Top-left to center -->
    <path d="M 270 278 L 478 424 L 468 440 L 258 294 Z" />
    <!-- Center to top-right -->
    <path d="M 524 426 L 720 235 L 732 248 L 534 438 Z" />
    <!-- Center to right-mid -->
    <path d="M 530 452 L 698 472 L 696 490 L 528 468 Z" />
    <!-- Center to bottom-left -->
    <path d="M 478 458 L 298 566 L 290 552 L 472 444 Z" />
    <!-- Top-right to right-mid -->
    <path d="M 742 248 L 728 458 L 712 456 L 726 246 Z" />

    <!-- Small accent nodes on connections -->
    <circle cx="380" cy="195" r="14" />
    <circle cx="620" cy="178" r="14" />
    <circle cx="370" cy="360" r="14" />
    <circle cx="630" cy="340" r="14" />
    <circle cx="620" cy="462" r="12" />
    <circle cx="380" cy="510" r="12" />
