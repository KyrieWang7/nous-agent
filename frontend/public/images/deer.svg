      L 440 60 Z
    " />
    <!-- Brain outer contour - right half -->
    <path d="
      M 560 60
      C 640 60, 720 90, 780 140
      C 830 185, 865 245, 885 310
      C 900 360, 900 410, 890 460
      C 878 520, 850 570, 810 610
      C 775 645, 730 665, 680 672
