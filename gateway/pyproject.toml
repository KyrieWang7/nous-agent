[project]
name = "nous-gateway"
version = "0.1.0"
description = "Shared product gateway for Nous Agent harnesses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nous-agent",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.14.11"]

[tool.uv.sources]
nous-agent = { path = "../agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nous_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
