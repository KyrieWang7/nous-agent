# Alembic configuration for nous-agent.
#
# nous-agent uses raw asyncpg at runtime; these migrations are intentionally
# raw-SQL (op.execute) rather than ORM-model autogenerate. The database URL is
# resolved at runtime from the LANGGRAPH_PG_URI environment variable (see
# migrations/env.py), so sqlalchemy.url here is only a placeholder.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Placeholder — overridden in env.py from LANGGRAPH_PG_URI.
sqlalchemy.url = postgresql+psycopg://agno:agno_password@localhost:5432/agno_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
